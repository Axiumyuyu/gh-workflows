name: Build Check

# 通用 Gradle 编译检查，PR 和非发版分支用。
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '21'
      java-distribution:
        type: string
        default: 'temurin'
      gradle-task:
        type: string
        default: 'build'
      gradle-args:
        type: string
        default: '--no-daemon --stacktrace'
      working-directory:
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ./gradlew ${{ inputs.gradle-task }} ${{ inputs.gradle-args }}
